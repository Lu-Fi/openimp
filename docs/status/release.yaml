# Release gates (user decision 2026-10-26). Machine-readable rules; read by tools/status_data.py (validator),
# tools/release_gates.py (section "Release gates" of FEATURE_MATRIX.md / feature-matrix.html) and tools/status_soak.py.
# Do not weaken a threshold here without a decision of the maintainers.
version: 1

# SoCs the gates apply to (T30, T32 and T33 are not part of RC3 / Release 1)
socs: [T10, T20, T21, T23, T31, T40, T41]

# Fleet cameras by shorthand (".N" = last octet of the LAN address) -> SoC. Used by tools/status_soak.py.
fleet:
  ".31": T10
  ".107": T20
  ".163": T20
  ".24": T21
  ".23": T23
  ".28": T23
  ".30": T23
  ".124": T23
  ".21": T31
  ".25": T31
  ".26": T31
  ".29": T31
  ".33": T31
  ".145": T31
  ".151": T31
  ".224": T31
  ".184": T40
  ".32": T41
  ".34": T41

gates:
  - id: rc3
    title: RC3
    milestone: RC3
    # issues with these labels belong into the GitHub milestone of the gate
    issue_labels: ["prio:streamer", "prio:release-gate"]
    rules:
      - id: rc3.streamer-functions
        text: >-
          Every vendor function that a streamer (timps, prudynt, raptor) calls works on every gate SoC.
          "Works" means the API matrix cell is dev, dev+, run, rt or no-op (a vendor no-op that OpenIMP matches).
          The streamer call sets are the "Used by" data of docs/api_evidence.json (docs/api_run.json for the fleet runs).
    works_cells: [dev, dev+, run, rt, no-op]

  - id: release1
    title: Release 1
    milestone: Release 1
    requires: rc3
    rules:
      - id: release1.rc3
        text: RC3 is green.
      - id: release1.stable-days
        text: >-
          The release image ran at least 14 days without a reset on the fleet (a reset is an unplanned reboot,
          an oops, or a new image, which restarts the counter).
        min_stable_days: 14
      - id: release1.cameras-per-soc
        text: At least 1 camera per gate SoC reaches the stable days (counted per camera; a SoC is as good as its best camera).
        min_cameras_per_soc: 1
      - id: release1.unplanned-reboots
        text: 0 unplanned reboots in the counted window.
        max_unplanned_reboots: 0
      - id: release1.oops
        text: 0 kernel oops in the counted window.
        max_oops: 0
      - id: release1.planned
        text: >-
          Planned flashes and tests on a camera are excluded only if the camera STATUS log marks the line as planned
          (the word "planned", not "unplanned"; a flash with "full OTA" is planned by definition but starts a new image counter).
        planned_marker: planned
