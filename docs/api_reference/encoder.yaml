# Descriptions for the Encoder API pages (tools/gen_api_wiki.py -> wiki page API-Encoder).
# Own words only; the vendor documentation is read for understanding, never copied.
title: Encoder
intro: |
  The encoder module turns frames from a FrameSource channel into H.264, H.265 or JPEG streams. An encoder channel
  belongs to a group; the group is bound to a FrameSource channel with `IMP_System_Bind`. The application pulls
  finished streams with `GetStream` (or waits with `PollingStream` first) and gives them back with `ReleaseStream`.

  **Typical call order:** `CreateGroup`, `CreateChn` with a `IMPEncoderChnAttr` (use `SetDefaultParam` to fill it),
  `RegisterChn`, bind the group to the FrameSource, `StartRecvPic`, then the loop `PollingStream`, `GetStream`,
  process, `ReleaseStream`. Stop with `StopRecvPic`, `UnRegisterChn`, `DestroyChn`, `DestroyGroup`.

  Rate-control behaviour differs between SoCs; the pages state where a setting is only stored. The rate-control modes
  are `FIXQP`, `CBR`, `VBR`, `CAPPED_VBR` and `CAPPED_QUALITY` (some SoCs also `SMART`). What OpenIMP does beyond the vendor
  library (closed-loop capped modes, HEVC on T31, telemetry) is collected in [Beyond the Vendor](Beyond-the-Vendor).
  Calls whose status is `·` on a SoC do not exist in that SoC's vendor library.
groups:
  - id: life
    title: Groups and channels
  - id: stream
    title: Streams
    intro: "One call chain per picture - `PollingStream` (wait), `GetStream` (take), `ReleaseStream` (return). OpenIMP keeps one outstanding stream per channel, so release it before the next fetch."
  - id: attr
    title: Channel attributes and defaults
  - id: rc
    title: Rate control
    intro: |
      Modes: `FIXQP` keeps one quantiser, `CBR` holds the bitrate, `VBR` lets it vary within a range, the capped modes limit
      the quality-driven rate to a ceiling. Bitrate is in kbit/s in the attribute structures.
  - id: gop
    title: GOP, key frames and frame rate
  - id: qp
    title: Quantiser, regions and picture quality
  - id: h26x
    title: H.264 and H.265 options
  - id: jpeg
    title: JPEG
  - id: yuv
    title: Unbound encoding of own frames (YUV interface)
    intro: |
      The encoder can be used without FrameSource: `YuvInit` creates an encoder context, `YuvEncode` encodes one frame
      you supply, `YuvExit` frees the context. The `_Ex` variants use an integer handle instead of a pointer.
  - id: mem
    title: Memory, buffer sharing and pools
  - id: misc
    title: Other
functions:
  Encoder_CreateGroup:
    group: life
    summary: Creates an encoder group, the container a FrameSource channel is bound to.
    params:
      encGroup: Group number.
    returns: "0 on success, -1 if the group number is invalid. Creating a group twice is not an error."
    see_also: [Encoder_CreateChn, Encoder_RegisterChn]
  Encoder_DestroyGroup:
    group: life
    summary: "Removes a group. All channels must be unregistered from it first."
    returns: "0 on success, -1 for an invalid or never created group, or when a channel is still registered in it."
  Encoder_CreateChn:
    group: life
    summary: Creates an encoder channel from an attribute structure (profile, size, rate control, GOP). The channel is idle until it is registered and receives pictures.
    params:
      encChn: Channel number.
      attr: Encoder, rate control and GOP attributes.
    returns: "0 on success, -1 on an invalid channel number or NULL attribute, a channel that already exists, invalid rate-control attributes, or a profile the SoC cannot encode (H.265 on a SoC without HEVC)."
    notes: "Create the channel before `RegisterChn`. The picture size has to match the FrameSource channel, and the rate-control block has to belong to the selected mode. The log prints the rate control that is really used; the requested mode can map to a different one on some SoCs."
    diff: Asking for H.265 on a SoC without HEVC hardware fails with -1 and a log line. The vendor library returns 0 and creates a channel that never produces a frame.
    see_also: [Encoder_SetDefaultParam, Encoder_RegisterChn]
  Encoder_DestroyChn:
    group: life
    summary: "Destroys a channel and frees its buffers. The channel has to be unregistered first (`StopRecvPic`, then `UnRegisterChn`)."
    returns: "0 on success, -1 for an invalid or never created channel, a channel that is still registered, or a stream that has not been released."
  Encoder_RegisterChn:
    group: life
    summary: "Attaches a created channel to a group, which makes it a destination of the FrameSource bound to that group."
    params:
      encGroup: Group number.
      encChn: Channel number.
    returns: "0 on success, -1 for an invalid group or channel, a channel that was not created, or one that is already registered."
  Encoder_UnRegisterChn:
    group: life
    summary: "Detaches a channel from its group. Stop the channel with `StopRecvPic` first."
    returns: "0 on success, -1 for an invalid, not created or not registered channel, or one that is still receiving pictures."
  Encoder_StartRecvPic:
    group: life
    summary: "Starts encoding. Pictures that arrive after this call are encoded."
    returns: "0 on success, -1 for an invalid channel or one that is not registered."
    notes: "Call after `RegisterChn` and after the bind."
    see_also: [Encoder_StopRecvPic]
  Encoder_StopRecvPic:
    group: life
    summary: "Stops encoding. A stream that is already encoded can still be fetched."
    returns: "0 on success, -1 for an invalid or not created channel."
  Encoder_GetStream:
    group: stream
    summary: Takes the next encoded stream of a channel. The stream consists of packs that point into the stream buffer of the channel.
    params:
      encChn: "Channel number."
      stream: "Receives the pack list and the stream description."
      block: "Non-zero waits for a stream (up to 1 second, as `PollingStream` does), zero returns at once."
    returns: "0 on success, -1 when there is no stream (timeout or `block` 0 without a ready stream), the channel is invalid, or on error."
    notes: "A stream is one picture, in several packs (parameter sets and slices). Return it with `ReleaseStream` before you take the next one: OpenIMP keeps one outstanding stream per channel."
    diff: "On T40 and T41 the picture is encoded when the application polls, not ahead of time; the encoder keeps at most one finished stream."
    see_also: [Encoder_PollingStream, Encoder_ReleaseStream]
  Encoder_GetStream_Impl:
    group: stream
    summary: Internal worker behind `GetStream`, exported by some builds of the library.
    unverified: true
  Encoder_ReleaseStream:
    group: stream
    summary: Returns a stream taken with `GetStream`.
    returns: "0 on success, -1 when the channel has no stream outstanding (nothing was fetched, or it was already released)."
  Encoder_PollingStream:
    group: stream
    summary: Waits until the channel has a stream or the timeout expires.
    params:
      encChn: Channel number.
      timeoutMsec: Maximum wait in milliseconds.
    returns: "0 when a stream is ready, -1 on timeout, for an invalid channel, or for a channel that is not created or not registered."
    notes: "A second thread that polls the same channel waits for the first to finish."
    diff: On T40 the wait honours its timeout even when the ISP delivers no frames.
    see_also: [Encoder_GetStream]
  Encoder_PollingModuleStream:
    group: stream
    summary: Waits on several channels at once and reports which have a stream.
    params:
      encChnBitmap: Bit mask of channels to wait on; on return the channels that are ready.
      timeoutMsec: Maximum wait in milliseconds.
    unverified: true
  Encoder_FlushStream:
    group: stream
    summary: "Requests a key frame and drops a finished stream that nobody has taken yet, so the next stream is fresh."
    returns: "0 on success, -1 for an invalid or not created channel."
  Encoder_GetFd:
    group: stream
    summary: "Returns a file descriptor that becomes readable while a finished stream waits for `GetStream`, for use with `select` or `poll`."
    returns: "The descriptor, or -1 for an invalid or not created channel."
    notes: "In OpenIMP the descriptor is the read end of a pipe. The first call starts a helper thread that polls the channel and fills the pipe; `ReleaseStream` and `FlushStream` empty it again. `UnRegisterChn` and `DestroyChn` stop the helper and close the pipe. Not in the vendor library of T10 and T20."
  Encoder_Query:
    group: stream
    summary: "Reads the channel statistics: registration state, pictures and streams waiting, and whether the encoder is working."
    params:
      encChn: "Channel number."
      stat: "Receives the six-word statistics structure (`registered`, `leftPics`, `leftStreamBytes`, `leftStreamFrames`, `curPacks`, `work_done`)."
    returns: "0 on success, -1 for an invalid channel, a NULL pointer or a channel that was not created. On T41 the channel errors are the vendor codes 0x80040001 and 0x80040008."
    notes: "`leftPics` is 1 while a picture is being encoded, otherwise 0. `leftStreamFrames` is 1 while a finished stream waits for `GetStream`; `leftStreamBytes` and `curPacks` are filled from it on T41 and the other SoCs built on the same backend, and stay 0 on T40. `work_done` is 0 while a picture is being encoded and 1 when idle. There are no bit rate counters."
    diff: "OpenIMP has no input queue on T40 and T41: the encoder works on demand in `PollingStream` / `GetStream`, so `leftPics` is at most 1 and the number of waiting pictures is not a measure of load."
  Encoder_GetChnAttr:
    group: attr
    summary: "Reads the attribute structure of a channel as it is currently stored."
    returns: "0 on success, -1 for an invalid channel, a NULL pointer or a channel that was not created."
    notes: "The structure reflects what the Set calls stored; on T41 the rate-control and GOP members are the read-back values, and the GOP length is reported the way the vendor does: GOP length times the same-scene count (the key frame distance)."
    see_also: [Encoder_CreateChn]
  Encoder_SetDefaultParam:
    group: attr
    summary: "Fills an attribute structure with defaults for a profile, rate-control mode, size, frame rate, GOP length, quality and bitrate."
    params:
      attr: "Structure to fill (cleared first)."
      profile: "`IMP_ENC_PROFILE_*`, for example AVC main or HEVC main."
      rcMode: "Rate-control mode (`IMP_ENC_RC_MODE_*`, 0 to 8; JPEG accepts any)."
      width: "Picture width."
      height: "Picture height."
      fpsNum: "Frame rate numerator."
      fpsDen: "Frame rate denominator."
      gop_length: "GOP length in frames."
      max_same_scene: "Maximum length of an unchanged scene (`uMaxSameSenceCnt`)."
      quality: "Initial QP (for FIXQP the QP itself)."
      bitrate: "Target bitrate in kbit/s. For VBR and the capped modes the maximum is set to 4/3 of it."
    returns: "0 on success, -1 for a NULL attribute, a size or frame rate of 0, an unknown codec type or an unknown rate-control mode (the structure is not touched then)."
    notes: "Start from this and then change the fields you need."
    soc: T31, T40, T41
  Encoder_GetChnEncType:
    group: attr
    summary: "Reads the payload type (H.264, H.265 or JPEG) of a channel."
    returns: "0 on success, -1 for an invalid channel, a NULL pointer or a channel that was not created."
    notes: "The type is an `IMPPayloadType` (`PT_H264`, `PT_H265`, `PT_JPEG`) on T21, T23 and T30 and an `IMPEncoderEncType` on the other SoCs."
  Encoder_Get/SetChnAttrRcMode:
    group: rc
    summary: "Reads or changes the rate-control attribute (mode and its parameters) of a created channel."
    returns: "0 on success, -1 for an invalid or not created channel, a NULL pointer, or a rate-control mode the SoC does not know or the codec refuses. On T41 the codes 0x80040001 (bad channel), 0x80040008 (channel not created) and 0x80040010 (bad argument) are used where the vendor does."
    notes: "Bit rates are in kbit/s. On T31, T40 and T41 the QP values are normalised before they reach the codec."
    diff: "On T21 and T23 the getter returns the values the running controller actually uses (clamped), so a read after a write can differ from what was written. On T41 the call at run time only changes the bit rate (target and maximum) and the QP window, and only when they differ from the current values; the mode, initial QP, deltas, maximum picture size and PSNR are ignored and not read back, and a FIXQP target is ignored. On a JPEG channel the T41 getter returns 0 and leaves the structure alone."
    see_also: [Encoder_Get/SetChnRcAttr]
  Encoder_Get/SetChnRcAttr:
    group: rc
    summary: Reads or sets the rate-control block through a generic pointer.
    unverified: true
  Encoder_SetChnBitRate:
    group: rc
    summary: Changes the target and maximum bitrate of a channel without touching the other rate-control settings.
    params:
      bitrate: "Target in bit/s (not kbit/s; OpenIMP divides by 1000)."
      bitrateMax: "Upper limit in bit/s. 0 or less uses the target; in CBR mode the maximum equals the target."
    returns: "0 on success, -1 for an invalid or not created channel or a bitrate of 0 or less. On T41, calls with no target bitrate, with FIXQP, or with a missing maximum in a mode other than CBR are ignored and return 0."
    notes: "The bitrate fields of the attribute structures (`uTargetBitRate`, `outBitRate`) are in kbit/s; this call takes bit/s."
    soc: T31, T40, T41
  Encoder_Get/SetMbRC:
    group: rc
    summary: "Switches macroblock-level rate control on or off for a created channel. When on, the quantiser can change inside a picture to hold the picture budget."
    params:
      channel: "Channel number."
      enable: "0 or 1; any other value is refused."
    returns: "0 on success, -1 for an invalid or not created channel, a NULL pointer or an enable value other than 0 and 1."
    notes: "On T21 and T23 the switch is passed to the macroblock rate control of the Helix encoder; its default is chosen with the `OPENIMP_EPRC_MBRC` variable. On the other SoCs that have the call the value is stored and read back. Only on the legacy encoder API (T10, T20, T21, T23, T30); T31, T40 and T41 do not have the call."
  Encoder_Get/SetSuperFrameCfg:
    group: rc
    summary: "Configures what happens when a single picture gets much larger than planned (a super frame): the size thresholds for I and P pictures and the action."
    returns: "0 on success, -1 for an invalid or not created channel or a NULL pointer. T20 accepts only the modes none and re-encode, T21 only none (no super-frame control in its rate controller); other modes return -1."
    notes: "The configuration is stored and read back by the getter. On T20 it is passed to the rate controller, on T23 to the encoder worker."
  Encoder_Get/SetChnMaxPictureSize:
    group: rc
    summary: "Sets or reads the largest size of an I and a P picture before the encoder lowers the quality. On T41 the sizes are in kbit and the encoder keeps both pictures at about 95 percent of the limit; on T23 one shared limit (the larger of the two) is used."
    params:
      maximum_i: "Limit for I pictures; 0 is refused (T23) or ignored (T41)."
      maximum_p: "Limit for P pictures; 0 is refused (T23) or ignored (T41)."
    returns: "0 on success, -1 for an invalid or not created channel or when a value is 0 (T23); on T41 a value of 0 is ignored with return 0, and the codec refusing the limit gives -1. The getter exists on T23 only; it reports the shared limit for both pictures."
    soc: "T23, T40, T41"
  Encoder_SetChnRcTrigLevel:
    group: rc
    summary: "Sets the trigger level and mode of the rate controller's re-encode. The pair is only stored in OpenIMP; there is no getter."
    returns: "0 for a valid channel (also for one that was not created), -1 for an invalid channel."
  Encoder_GetChnAveBitrate:
    group: rc
    summary: "Averages the bitrate over a number of streams that you pass in one by one."
    params:
      stream: "A stream just fetched; its pack sizes are added up."
      frames: "Window length in streams; when that many have been counted the average is published and the window restarts."
      bitrate: "Receives the result in kbit/s (a double on T40 and T41, an int on the others)."
    returns: "0 on success, -1 for an invalid channel, a NULL pointer or `frames` of 0 or less."
  Encoder_SetFrameRelease:
    group: rc
    summary: Sets the ratio at which the encoder gives the source frame back early (num/den).
    soc: T31, T40, T41
    unverified: true
  Encoder_Get/SetChnFrmRate:
    group: gop
    summary: "Reads or changes the output frame rate of a created channel."
    params:
      rate: "Frame rate as numerator and denominator; either value 0 is refused."
    returns: "0 on success, -1 for an invalid or not created channel, a NULL pointer, a zero numerator or denominator, or when the codec refuses the rate. On T41 the codes 0x80040001, 0x80040008 and 0x80040010 are used where the vendor does."
    notes: "The call takes effect at run time; the output time stamps restart at the next picture. On T21, T23 and T30 the functions take only the channel and the rate; on T31, T40 and T41 the header declares an additional, unused third argument. Keep the rate at or below the FrameSource rate."
  Encoder_Get/SetGOPSize:
    group: gop
    summary: "Reads or sets the GOP length - the number of pictures between two key frames - through the legacy `IMPEncoderGOPSizeCfg` structure."
    params:
      gop: "Structure holding `gopsize`."
    returns: "0 on success, -1 for a NULL pointer, a `gopsize` of 0 or less, or an invalid or not created channel (T20 getter: -1 for a channel that was not created)."
    notes: "The setter changes the maximum GOP length of the channel (the same value `SetChnGopLength` changes). A short GOP recovers faster after packet loss, a long one gives a smaller stream. The legacy structure exists on T10, T20, T21, T23 and T30; T31, T40 and T41 use `SetChnGopLength`."
  Encoder_Get/SetChnGopAttr:
    group: gop
    summary: Reads or sets the GOP attributes (length, type and reference structure).
    soc: T31, T40, T41
    unverified: true
  Encoder_SetChnGopLength:
    group: gop
    summary: Changes the GOP length of a running channel.
    soc: T31, T40, T41
    unverified: true
  Encoder_RequestIDR:
    group: gop
    summary: Asks the encoder to make the next picture a key frame (IDR), with fresh parameter sets.
    returns: "0 on success, -1 for an invalid or not created channel. On a JPEG channel the call does nothing and returns 0."
    notes: "Use it when a new client connects, or after a loss."
  Encoder_Get/SetGDRCfg:
    group: gop
    summary: Configures gradual decoder refresh, which refreshes the picture in slices over several frames instead of one large key frame.
    soc: T23
    unverified: true
  Encoder_RequestGDR:
    group: gop
    summary: Starts a gradual refresh cycle of the given number of frames.
    soc: T23
    unverified: true
  Encoder_Get/SetChangeRef:
    group: gop
    summary: "Reads or sets the switch for changing the reference picture."
    returns: "The setter returns 0 for a created channel and -1 for one that does not exist (T20: -1 also for a started channel). The getter returns 0, also for a channel that does not exist (T20: -1)."
    notes: "OpenIMP keeps the value; only the vendor encoder's reference-structure code reads it, so there is no visible effect on the Helix encoder."
  Encoder_Get/SetChnHSkip:
    group: gop
    summary: Reads or sets the hierarchical skip mode, a reference structure in which some predicted pictures can be dropped.
    notes: Needs a created channel. On T10, T20 and T30 the setting is only stored.
    unverified: true
  Encoder_SetChnHSkipBlackEnhance:
    group: gop
    summary: "Sets the black enhancement flag of the skip mode."
    returns: "-1 for an invalid channel, otherwise 0 (the flag is kept; the Helix path codes no skip structure)."
  Encoder_Get/SetChnFrmUsedMode:
    group: gop
    summary: Reads or sets the frame use mode, which says how input frames are used by the encoder.
    unverified: true
  Encoder_SetChnQp:
    group: qp
    summary: "Fixes the quantiser (QP) of the channel to one value for I, P and B pictures."
    returns: "0 on success, -1 for an invalid or not created channel or a QP outside 0 to 51."
    soc: "T31"
  Encoder_SetChnQpBounds:
    group: qp
    summary: Sets the lowest and highest quantiser the rate control may use.
    params:
      minQp: "Lowest QP, lower means better quality."
      maxQp: "Highest QP (51 at most)."
    returns: "0 on success, -1 for an invalid or not created channel, a minimum below 0, a maximum above 51, or a minimum above the maximum. On T41 values of 0 or less are ignored and return 0."
    notes: "On T41 the values are clamped to what the hardware accepts."
    soc: T31, T40, T41
  Encoder_SetChnQpBoundsPerFrame:
    group: qp
    summary: "Sets separate QP bounds for I and P pictures."
    returns: "0 on success, -1 for an invalid or not created channel, or values outside 0 to 51 or a minimum above a maximum. On T41 the codes of `SetChnQpBounds` are used, and the call is silently ignored (return 0) unless all four values are above 0. Where the backend has one QP window only, the union of the two windows is applied."
    soc: "T41"
  Encoder_SetChnQpIPDelta:
    group: qp
    summary: "Sets the QP difference between I and P pictures."
    returns: "0 on success, -1 for an invalid or not created channel or when the codec refuses the value."
    soc: T31
  Encoder_SetChnInitQP:
    group: qp
    summary: "Sets the quantiser of the first picture (T23)."
    returns: "0 on success, -1 for an invalid channel or a QP outside 1 to 51."
    soc: "T23"
  Encoder_Get/SetQpgMode:
    group: qp
    summary: "Selects the quantiser generator mode (`ENC_QPG_CLOSE` to `ENC_QPG_SASM_TAB`, 0 to 7)."
    returns: "0 on success, -1 for an invalid or not created channel, a NULL pointer or a mode outside 0 to 7. T21 does not check the range and returns 0 for a channel that does not exist, as the vendor library does."
    notes: "The mode is stored and read back. On T23 it is passed to the encoder worker; on T21 nothing reads it."
  Encoder_Get/SetChnROI:
    group: qp
    summary: "Defines up to eight regions of interest (index 0 to 7) in which the picture is coded with a different quantiser."
    params:
      config: "Index of the region, enable flag, relative or absolute QP and the rectangle."
    returns: "0 on success, -1 for an invalid or not created channel, a NULL pointer or an index of 8 or more. A non-H.264 channel accepts the call and ignores it. On T23 a channel that was not created also returns 0. The T30 build refuses an enabled region with -1."
    notes: "The rectangle is converted to the 16-pixel macroblock grid, so the getter returns the rounded rectangle. The relative QP range is -25 to 25, the absolute range 0 to 51; values outside are clamped (a warning is logged once). The T21 region can be turned off with `OPENIMP_T21_ROI=0`. Only on the legacy encoder API (T10, T20, T21, T23); T31, T40 and T41 use `SetChnRoiAttr`."
  Encoder_Get/SetChnRoiAttr:
    group: qp
    summary: Region of interest attributes of the newer SoCs, with several regions and a QP value for each.
    soc: T40, T41
    unverified: true
  Encoder_SetChnMapRoi:
    group: qp
    summary: Sets a region of interest from a map with one entry per macroblock.
    soc: T40, T41
    unverified: true
  Encoder_Get/SetChnColor2Grey:
    group: qp
    summary: "Makes the encoder code an H.264 picture without colour (the chroma plane is neutral), which saves bits at night."
    returns: "0 on success, -1 for an invalid or not created channel or a NULL pointer."
    notes: "The enable flag is stored and read back. On T10, T20 and T21 it is applied from the next IDR picture on, and only on an H.264 channel; on T23 it is passed to the encoder worker."
    soc: "T10, T20, T21, T23, T30"
  Encoder_Get/SetChnDenoise:
    group: qp
    summary: "Reads or sets the encoder-side noise filter (type and the QP values for I and P pictures)."
    returns: "0 on success. -1 for an invalid channel or a NULL pointer; the setter on T23 and the other SoCs also -1 for a channel that was not created (T20 and T21: 0). The setter on T30 returns -1 for a filter type other than 0 when the channel was created with denoise enabled."
    notes: "The on/off switch of the filter is the one given at channel creation; the setter changes only the type and the QP values. T20 and T21 check the combination of values in the same way as the vendor library."
    soc: "T10, T20, T21, T23"
  Encoder_Get/SetChnDemask:
    group: qp
    summary: Reads or sets the demask (lens shading) attribute of the encoder. The values are stored.
    soc: T10, T20
    unverified: true
  Encoder_Get/SetChnCrop:
    group: qp
    summary: Crops the picture at the encoder input.
    soc: T23
    unverified: true
  Encoder_SetChnResizeMode:
    group: qp
    summary: Switches the resize mode of the channel.
    soc: T31, T40, T41
    unverified: true
  Encoder_Get/SetH264TransCfg:
    group: h26x
    summary: "Reads or sets the H.264 chroma QP index offset."
    returns: "0 on success, -1 for an invalid or not created channel, a NULL pointer or an offset outside -12 to 12. The T30 build accepts only an offset of 0."
    notes: "The offset applies from the next IDR picture on (written into the picture parameter set). Stored and read back on all SoCs of the legacy encoder API."
    soc: "T10, T20, T21, T23"
  Encoder_Get/SetH265TransCfg:
    group: h26x
    summary: "Reads or sets the H.265 chroma QP offsets for Cb and Cr. Stored and read back on T30; dropped on T21 and T23."
    returns: "0 on success. -1 for an invalid channel or a NULL pointer; on T30 also a channel that was not created or an offset outside -12 to 12. T21 and T23 check only channel and pointer, store nothing, and the getter returns zeros."
    soc: "T20, T21, T23"
  Encoder_SetChnEntropyMode:
    group: h26x
    summary: Chooses CAVLC or CABAC for H.264.
    soc: T31
    unverified: true
  Encoder_Get/SetChnSeiAttr:
    group: h26x
    summary: Enables and configures a user-data SEI message that is written into the stream.
    diff: On IDR pictures of T40 the SEI may be left out, because the header area holds the parameter sets twice.
    soc: T40, T41
    unverified: true
  Encoder_InsertUserData:
    group: h26x
    summary: Inserts user data into the stream of the next picture, as a user_data_unregistered SEI message.
    params:
      data: Bytes to insert.
      size: Length in bytes.
    soc: T10, T20, T21, T23
    unverified: true
  Encoder_Get/Setframelossthd:
    group: h26x
    summary: "Reads or sets the frame loss threshold in bytes (T23). The value is kept for the getter."
    returns: "0 on success, -1 for an invalid or not created channel or a NULL pointer."
    soc: "T23"
  Encoder_SetMultiSectionMode:
    group: h26x
    summary: Sets slice (section) splitting of pictures. Kept for the getter only on T23.
    soc: T23
    unverified: true
  Encoder_Get/SetJpegeQl:
    group: jpeg
    summary: Reads or sets the quantisation table level of a JPEG channel - the picture quality.
    notes: Takes effect on the next picture. Can be called while the channel runs.
    unverified: true
  Encoder_SetAvpuJpegQp:
    group: jpeg
    summary: "Sets the JPEG quality (0 to 100) of a JPEG channel from the next picture on (T41)."
    returns: "0 on success. The vendor codes 0x80040001 (channel 8 or more), 0x80040002 (quality above 100, or the channel is not a JPEG channel) and 0x80040008 (channel not created)."
    soc: "T41"
  Encoder_InputJpege:
    group: jpeg
    summary: "Encodes one NV12 picture to a baseline JPEG without an encoder channel. The chroma plane follows directly after the `src_w * src_h` luma bytes."
    params:
      src: "Source picture, NV12, luma plane followed by the interleaved chroma plane."
      dst: "Output buffer. There is no capacity argument, so it must hold the worst case."
      src_w: "Width. T41: multiple of 32. T23: even."
      src_h: "Height. T41: multiple of 8. T23: even."
      q: "Quality 1 to 100; any other value gives 75."
      stream_length: "Receives the JPEG size in bytes (0 on failure)."
    returns: "0 on success, -1 for a NULL pointer, a size outside the limits above, or an encoder failure."
    notes: "On T41 the picture is coded by the software JPEG encoder; the vendor library ignores `q` there, OpenIMP honours it. On T23 the Helix hardware codes the picture, with the software encoder as a fallback, and the quality scales the quantisation tables."
    soc: "T23, T41"
  Encoder_InputJpege_Ex:
    group: jpeg
    summary: "Same as `InputJpege` for the secondary-process interface of the vendor library. In OpenIMP it works only in the process that owns the encoder."
    returns: "0 on success, -1 on a height that is not a multiple of 16, in a process that does not own the encoder (errno ENOTSUP), and for the errors of `InputJpege`."
    soc: "T41"
  Encoder_YuvInit:
    group: yuv
    summary: "Creates an encoder context for frames supplied by the application, without a FrameSource channel."
    params:
      h: "Receives the context handle."
      inWidth: "Frame width. T40/T41: multiple of 16. T23: even (the native T23 encoder also needs a multiple of 16)."
      inHeight: "Frame height. T40/T41: multiple of 8. T23: even."
      encIn: "Codec type, rate control, frame rate and GOP length (`IMPEncoderYuvIn`). T23 accepts H.264 only."
    returns: "0 on success, -1 for a NULL argument, an unsupported size or type, no free context, or when the encoder cannot be created. T40/T41 provide a limited number of simultaneous contexts."
    notes: "On T40 and T41 the context runs the same codec as a bound channel, so rate control and GOP behave the same. On T41 a user buffer given in `encIn` has to come from `VbmAlloc`."
    soc: "T23, T40, T41"
  Encoder_YuvEncode:
    group: yuv
    summary: "Encodes one frame with the context and copies the finished stream into the caller's buffer."
    params:
      h: "Context from `YuvInit`."
      frame: "Frame description with physical and virtual address of an NV12 picture (`IMPFrameInfo`, passed by value)."
      encOut: "Output buffer `outAddr`; on entry `outLen` is the capacity (0 = unchecked on T40/T41), on return the length of the access unit."
    returns: "0 on success, -1 for an invalid handle, a missing output buffer, a frame the encoder cannot use, an encode failure, no stream within 2 seconds (T40/T41), or a stream larger than the given capacity. `outLen` is 0 after a failure on T40/T41."
    notes: "Use frame memory from `VbmAlloc` where possible. On T40/T41 a frame outside reserved memory, or whose chroma plane follows a luma plane of exactly `width * height` bytes, is copied into the layout the encoder reads. On T23 the frame size and dimensions must match the context, and `outLen` must be non-zero on entry."
    diff: "A picture that does not fit the output buffer fails with -1 and `outLen` 0, instead of writing past the buffer."
    soc: "T23, T40, T41"
  Encoder_YuvExit:
    group: yuv
    summary: "Destroys the context and frees its resources."
    returns: "0 on success, -1 for an invalid or NULL handle."
  Encoder_YuvRequestIDR:
    group: yuv
    summary: "Makes the next frame of the context a key frame."
    returns: "0 on success, -1 for a NULL handle or when the encoder refuses the request."
    soc: "T23"
  Encoder_YuvGetCrop:
    group: yuv
    summary: "Reads the crop of a context (T23)."
    returns: "0 on success, -1 for a NULL handle or pointer or when the crop cannot be read."
    soc: "T23"
  Encoder_YuvSetCrop:
    group: yuv
    summary: "Sets a crop rectangle on a context (T23). All values must be even and the rectangle inside the picture; the margins between rectangle and the 16-aligned picture edge must stay below 510 pixels."
    returns: "0 on success, -1 for a NULL handle or pointer, an odd value, a rectangle outside the picture, a margin of 510 pixels or more, or when the encoder refuses it."
    soc: "T23"
  Encoder_YuvInit_Ex:
    group: yuv
    summary: "Same as `YuvInit`, but returns a small integer handle (0 to 7) instead of a pointer. In OpenIMP it works only in the process that owns the encoder."
    returns: "0 on success, -1 on the errors of `YuvInit`, when all 8 handles are in use, or in a process without the encoder (errno ENOTSUP)."
  Encoder_YuvEncode_Ex:
    group: yuv
    summary: "Same as `YuvEncode` with an integer handle."
    returns: "The result of `YuvEncode`; -1 for an unknown handle or in a process without the encoder (errno ENOTSUP)."
  Encoder_YuvExit_Ex:
    group: yuv
    summary: "Same as `YuvExit` with an integer handle; the handle is free for reuse afterwards."
    returns: "The result of `YuvExit`; -1 for an unknown handle or in a process without the encoder (errno ENOTSUP)."
  Encoder_VbmAlloc:
    group: yuv
    summary: "Allocates a physically contiguous buffer from reserved memory that the YUV and JPEG interfaces can read."
    params:
      size: "Size in bytes."
      align: "Alignment in bytes: 0 or a power of two up to 4096."
    returns: "Pointer to the buffer, or NULL for a size of 0, a larger alignment, a non-power-of-two alignment, or when no memory is left."
  Encoder_VbmFree:
    group: yuv
    summary: "Frees a buffer from `VbmAlloc`. A NULL pointer is ignored."
  Encoder_VbmV2P:
    group: yuv
    summary: "Converts a virtual address of such a buffer to its physical address. Returns 0 for an address the allocator does not own."
  Encoder_VbmP2V:
    group: yuv
    summary: "Converts the physical address of a `VbmAlloc` buffer back to the virtual one. Returns 0 for a physical address of 0."
  Encoder_VbmAlloc_Ex:
    group: yuv
    summary: "Allocation for the secondary-process interface. In OpenIMP the same as `VbmAlloc`, but only in the process that owns the encoder; elsewhere it returns NULL (errno ENOTSUP)."
  Encoder_VbmFree_Ex:
    group: yuv
    summary: "Free for the secondary-process interface. In OpenIMP the same as `VbmFree`, but only in the process that owns the encoder; elsewhere it does nothing."
  Encoder_Get/SetMaxStreamCnt:
    group: mem
    summary: "Sets or reads how many output streams a channel may hold."
    params:
      channel: "Channel number."
      count: "1 to 16."
    returns: "-1 for an invalid channel or a count outside 1 to 16. On T31, T40 and T41 the setter also fails with -1 once the channel is created."
    notes: "Call the setter before `CreateChn` on T31, T40 and T41."
  Encoder_Get/SetStreamBufSize:
    group: mem
    summary: "Sets or reads the size, in bytes, of the stream buffer of a channel."
    returns: "-1 for an invalid channel, a size of 0 or less, or a channel that is already created."
    notes: "Set it before `CreateChn`; it should hold several key frames at your bitrate."
    soc: T31, T40, T41
  Encoder_SetbufshareChn:
    group: mem
    summary: "Records which channel a JPEG channel should share its buffers with."
    params:
      shareChn: "The video channel to share with."
    returns: "0 on success; an error code for a channel or share channel number that is out of range."
    notes: "In OpenIMP the value is only stored; a channel always has its own buffers. When the JPEG channel is created and the share channel does not hold a video encoder yet, OpenIMP logs a warning (the vendor library fails there) and goes on."
    soc: "T31, T40, T41"
  Encoder_SetAvpuBsShare:
    group: mem
    summary: Switches sharing of the stream buffer of the hardware encoder.
    soc: T41
    unverified: true
  Encoder_SetRdBufShare:
    group: mem
    summary: Switches sharing of the read buffer between channels.
    soc: T23
    unverified: true
  Encoder_SetIvpuBsSize:
    group: mem
    summary: "Sets the size of the bitstream buffer of the second hardware unit (T41). OpenIMP encodes JPEG on the CPU, so the value only limits the size of the JPEG that `InputJpege` returns."
    returns: "0 on success, 0x80040002 for a size of 0, 0x80040040 when called after the system was initialised (`IMP_System_Init`)."
    notes: "Call it before `IMP_System_Init`."
    soc: "T41"
  Encoder_SetPoolSize:
    group: mem
    summary: "Sets the size of the encoder bitstream pool. On T30 it sets the bitstream buffer (1920 * 1080 bytes unless set); on the other SoCs the value is only kept."
    returns: "0 on success, -1 for a size of 0 or less."
  Encoder_Get/SetPool:
    group: mem
    summary: "Records which memory pool the channel is bound to, or reads it back (-1 = none)."
    params:
      encChn: "Channel number."
      poolId: "Pool id, or -1 for none."
    returns: "The setter returns 0, or -1 for an invalid channel or an id below -1; the getter returns the id, or -1 for an invalid channel."
    diff: "In OpenIMP a pool is a name only: every channel takes its buffers from the one common memory arena, so the id changes nothing about where buffers come from."
    soc: "T23, T31, T40, T41"
  Encoder_ClearPoolId:
    group: mem
    summary: Forgets the pool id of the channel.
    soc: T31
    unverified: true
  Encoder_Get/SetFisheyeEnableStatus:
    group: misc
    summary: Marks the channel as a fisheye channel. The flag is only stored.
    unverified: true
  Encoder_EnableAllNCUDenoise:
    group: misc
    summary: Switches the NCU based denoise on for all channels. Internal entry kept for compatibility.
    unverified: true
  Encoder_DisableAllNCUDenoise:
    group: misc
    summary: Switches the NCU based denoise off for all channels.
    unverified: true
  Encoder_PadFrame:
    group: misc
    summary: Pads the frame to the encoder size. Not exported by OpenIMP on T10, T20, T21 and T31.
    unverified: true
  Encoder_SetPadFrameAttr:
    group: misc
    summary: Sets the padding attributes for `PadFrame`.
    unverified: true
  Encoder_GetChnEvalInfo:
    group: misc
    summary: "Reads the evaluation record of the most recent picture of an H.264 channel on T31: six hardware picture counters, then the slice QP and the lowest and highest QP used."
    params:
      encChn: "Channel number."
      info: "Buffer of at least 36 bytes."
    returns: "0 on success, -1 for an invalid channel, a NULL pointer or a channel that was not created (errno ENOTSUP on the SoCs that do not have it). The record is 36 bytes (8 bytes for a JPEG channel) and is refreshed with every stream the encoder finishes."
    soc: "T31"