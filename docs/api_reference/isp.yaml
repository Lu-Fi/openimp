# Descriptions for the ISP API pages (tools/gen_api_wiki.py -> wiki page API-ISP).
# Own words only; the vendor documentation is read for understanding, never copied.
title: ISP (including ISP tuning)
intro: |
  The ISP module opens the image signal processor, registers the camera sensor and exposes the tuning interface:
  exposure, white balance, colour, noise reduction, flip, crop, day/night and the statistics the ISP collects. The
  calls named `IMP_ISP_Tuning_*` change the picture while the stream runs; they only work between `EnableTuning` and
  `DisableTuning`.

  **Typical start-up order:** `IMP_ISP_Open`, `IMP_ISP_AddSensor`, `IMP_ISP_EnableSensor`, `IMP_System_Init`, create and
  enable the FrameSource channels, `IMP_ISP_EnableTuning`, then the tuning calls. Shut down in reverse order:
  `DisableTuning`, `DisableSensor`, `DelSensor`, `IMP_ISP_Close`.

  Many calls exist twice in the vendor library family: a plain form and a `_Sec` form (and `ISP_MultiCamera_` prefix) for
  the second sensor of a dual-sensor SoC (T23, and T40 and T41 with their own `_VI` forms). The second-sensor forms are
  not described separately; they take the same arguments.

  **Signatures differ between SoC families.** The declarations on this page are those of the OpenIMP header, which follows
  the T10 to T31 form. On T40 and T41 most tuning calls take the video input (`IMPVI_NUM num`, normally `IMPVI_MAIN`) as an
  extra first argument, and the one-byte picture controls (brightness, contrast, sharpness, saturation, hue) take a pointer
  to the value; check the vendor header of the SoC you build for. On T10 to T31 a failed call returns -1; T40 and T41
  return their own negative codes for some failures (for example -4 for a video input number that is out of range).
  On T10 to T31 every `Tuning` call made outside the `EnableTuning` / `DisableTuning` window returns -1.
groups:
  - id: life
    title: Open, sensor and tuning session
  - id: ae
    title: Exposure (AE)
    intro: The auto exposure chooses integration time and gains to reach a brightness target. These calls read what it chose, limit it, or take it over.
  - id: awb
    title: White balance (AWB)
  - id: color
    title: Colour, contrast and sharpness
    intro: Simple picture controls. Brightness, contrast, saturation and sharpness are one byte; 128 is the default and the byte goes unchanged to the ISP driver (above 128 increases the effect, below decreases it).
  - id: nr
    title: Noise reduction, defog and dynamic range
  - id: dn
    title: Day/night, scene and running mode
  - id: flip
    title: Flip, crop and zoom
  - id: wdr
    title: Wide dynamic range
  - id: af
    title: Autofocus statistics
  - id: stat
    title: Statistics and reading the ISP state
  - id: osd
    title: OSD, masks and drawing
    intro: Overlays that the ISP or the mscaler draws into the picture. The software OSD of the `IMP_OSD` module is the usual choice; these calls are the lower level used on some SoCs.
  - id: ldc
    title: Lens correction, bypass and raw
  - id: sys
    title: Board hooks and internals
    intro: GPIO, camera input selection and helper entries of the vendor library that are exported for binary compatibility. Applications seldom call them.
functions:
  ISP_Open:
    group: life
    summary: "Opens the ISP device (`/dev/tx-isp`, on T20 `/dev/v4l-subdev0`). Has to be the first ISP call."
    returns: "0 on success, -1 if the device cannot be opened (driver not loaded). On T40 and T41 a second call while the device is open returns 0."
    see_also: [ISP_Close]
  ISP_Close:
    group: life
    summary: "Closes the ISP device. The sensor has to be disabled and deleted first."
    notes: "On T40 and T41 the call returns -1 while a sensor is still added or enabled or while tuning is enabled."
    see_also: [ISP_Open]
  ISP_AddSensor:
    group: life
    summary: "Registers a sensor with the ISP driver and selects it. The `IMPSensorInfo` structure names the sensor and its control bus."
    params:
      pinfo: "Sensor description (`IMPSensorInfo`), with the sensor name that the driver knows (for example `gc2053`). On T40 and T41 the first argument is the video input (`IMPVI_NUM`, normally `IMPVI_MAIN`)."
    returns: "0 on success, -1 on a NULL argument, when the ISP device is not open, when a sensor is already running (call `DisableSensor` first), when the driver refuses the registration, or when no sensor of that name is known to the driver. On T40 and T41 a second `AddSensor` without `DelSensor` also returns -1."
    notes: "The sensor driver module has to be loaded first. Dual-sensor SoCs also have `IMP_ISP_AddSensor_VI(vi, pinfo)` for the second input."
    see_also: [ISP_EnableSensor, ISP_DelSensor]
  ISP_DelSensor:
    group: life
    summary: Removes a registered sensor from the ISP driver.
    unverified: true
    see_also: [ISP_AddSensor]
  ISP_EnableSensor:
    group: life
    summary: Powers up the registered sensor and starts its data stream into the ISP.
    notes: "Do it before `IMP_System_Init` (the usual start-up order of the vendor samples). The `_VI` form selects the sensor input on dual-sensor SoCs."
    unverified: true
    see_also: [ISP_DisableSensor]
  ISP_DisableSensor:
    group: life
    summary: Stops the sensor stream and powers the sensor down.
    unverified: true
    see_also: [ISP_EnableSensor]
  ISP_EnableTuning:
    group: life
    summary: Starts the tuning session, which allows all `IMP_ISP_Tuning_*` calls.
    notes: "The vendor samples call it after the FrameSource channels are enabled. On T10 to T31 every tuning call made before it returns -1."
    see_also: [ISP_DisableTuning]
  ISP_DisableTuning:
    group: life
    summary: Ends the tuning session.
  ISP_Tuning_Get/SetSensorFPS:
    group: life
    summary: "Sets or reads the frame rate of the sensor as a fraction."
    params:
      fps_num: "Numerator, for example 25."
      fps_den: "Denominator, for example 1."
    notes: "On T40 and T41 the arguments are the video input and a frame-rate structure instead of two integers. Whether the sensor driver rounds the value to a supported rate was not checked, so read the value back."
    unverified: true
    see_also: [FrameSource_Get/SetChnAttr]
  ISP_Tuning_GetSensorAttr:
    group: life
    summary: Reads the description of the registered sensor (name, resolution, bus, frame rate range).
    unverified: true
  ISP_Tuning_SetVideoDrop:
    group: life
    summary: "Installs a callback that the library calls when the stream has stalled: no frame for 2 seconds, then again after 4 and 6 seconds (at most three times in a row, a new count starts when frames return)."
    params:
      cb: "Callback without arguments (`void (*)(void)`); use it to restart the stream or to reboot the camera. Pass NULL to remove it."
    returns: "0 on success, -1 if tuning is not enabled or the monitor thread cannot start."
    notes: "OpenIMP counts the frames its FrameSource hands out, and only while a channel is streaming and has a reader; a stream that was stopped on purpose is not reported. The callback runs in a library thread."
  ISP_Tuning_WaitFrame:
    group: stat
    summary: "Blocks until the ISP has finished a frame or the timeout has expired, and reports the frame-done counter."
    params:
      attr: "`timeout` (in, milliseconds) and `cnt` (out, 64-bit count of finished frames; also filled after a timeout on T20 and T21)."
    returns: "0 on success, non-zero (-1) on timeout or error."
  ISP_Tuning_WaitFrameDone:
    group: stat
    summary: "Frame-done wait of the newer SoCs (`IMPVI_NUM` and the same attribute structure as `WaitFrame`). On T41 a timeout returns -1 with `errno` ETIMEDOUT and leaves the structure unchanged."
    unverified: true
  ISP_Tuning_Get/SetExpr:
    group: ae
    summary: "Reads the exposure mode and integration time in use, or overrides them. `IMPISPExpr` holds the mode (auto or manual) and the integration time, in lines or in microseconds."
    notes: "A manual setting stops the auto exposure; set the mode back to auto to resume. The structure carries no gain fields. Details of the clamping were not checked."
    unverified: true
    see_also: [ISP_Tuning_GetEVAttr, ISP_Tuning_Get/SetAeComp]
  ISP_Tuning_GetEVAttr:
    group: ae
    summary: "Reads the exposure state into `IMPISPEVAttr`, an array of six 32-bit values. The order of the values follows the vendor library of the SoC."
    notes: "Use it for telemetry; to see how bright the scene is, read `GetTotalGain`."
    unverified: true
  ISP_Tuning_Get/SetAeComp:
    group: ae
    summary: Moves the brightness target of the auto exposure up or down (exposure compensation).
    params:
      comp: "Compensation. The vendor library recommends 0 to 255; 128 is the default. Higher values give a brighter picture. Measured picture brightness for comp 0, 128 and 255: 56, 105 and 245 on T20, 55, 100 and 160 on T31."
    notes: "The AE reacts slowly: on T31 allow about 30 seconds after a change. The vendor T40 and T41 libraries have no `AeComp` call; there the same effect is the `AeTargetComp` field of `Get/SetAeScenceAttr` (0 to 255, 128 neutral)."
  ISP_Tuning_Get/SetMaxAgain:
    group: ae
    summary: Limits the analogue gain the auto exposure may use.
    params:
      gain: "Maximum analogue gain in the gain unit of the ISP. The vendor T21 documentation gives 0 for 1x and 32 for 2x, which suggests a logarithmic scale; other SoCs were not checked."
    notes: "Lowering it reduces noise in the dark at the price of a darker picture or longer integration time."
    unverified: true
  ISP_Tuning_Get/SetMaxDgain:
    group: ae
    summary: "Limits the digital gain the auto exposure may use."
    unverified: true
    see_also: [ISP_Tuning_Get/SetMaxAgain]
  ISP_Tuning_Get/SetBacklightComp:
    group: ae
    summary: "Sets the strength of backlight compensation."
    params:
      strength: "Strength; the scale was not verified."
    notes: "On T41 the open driver answers -EOPNOTSUPP (the call fails instead of being accepted without effect). On T40 the value is only stored."
    unverified: true
  ISP_Tuning_Get/SetHiLightDepress:
    group: ae
    summary: "Sets how strongly very bright areas are held down."
    params:
      strength: "0 switches the function off; the vendor T21 documentation gives 0 to 10 as the range."
    notes: "On T41 the open driver answers -EOPNOTSUPP. On T40 the value is only stored."
    unverified: true
  ISP_Tuning_Get/SetAntiFlickerAttr:
    group: ae
    summary: Selects the mains-flicker avoidance of the exposure control.
    params:
      attr: "On T10 to T31: `IMPISP_ANTIFLICKER_DISABLE` (0), `IMPISP_ANTIFLICKER_50HZ` (1) or `IMPISP_ANTIFLICKER_60HZ` (2), passed by value; other values return -1. On T40 and T41: the video input and a pointer to a structure with `mode` and `freq`."
    notes: "Set it to the frequency of the local mains so the integration time is a multiple of the light period; with the wrong value the picture shows moving bands."
  ISP_Tuning_Get/SetIntegrationTime:
    group: ae
    summary: Sets or reads the exposure integration time, either as a value or as a range for the auto exposure.
    diff: On T21 the range part (upper limit of the auto exposure time) is honoured by OpenIMP; the vendor library ignores it.
    unverified: true
  ISP_Tuning_Get/SetAeAttr:
    group: ae
    summary: Reads or changes the AE attributes block (targets, speed, exposure limits) in one structure.
    unverified: true
  ISP_Tuning_Get/SetAeExprInfo:
    group: ae
    summary: Reads or sets the exposure parameter block of the AE on the newer SoCs.
    unverified: true
  ISP_Tuning_Get/SetAeScenceAttr:
    group: ae
    summary: Reads or sets the AE scene attributes (metering mode, target brightness and limits for a scene).
    unverified: true
  ISP_Tuning_Get/SetAeSpeed:
    group: ae
    summary: Sets or reads how fast the auto exposure converges to a new target.
    unverified: true
  ISP_Tuning_Get/SetAeConvergeStep:
    group: ae
    summary: Sets or reads the step size of the AE convergence.
    diff: The value is stored and returned; it does not change the convergence.
    unverified: true
  ISP_Tuning_Get/SetAeStrategy:
    group: ae
    summary: "Chooses how the exposure control splits a change between integration time and gain (`IMPISPAeStrategy`: balanced or integration-time priority)."
    unverified: true
  ISP_Tuning_Get/SetAeMin:
    group: ae
    summary: Sets or reads the lower limit of the exposure (minimum integration time and gain) of the auto exposure.
    unverified: true
  ISP_Tuning_Get/SetAeTargetList:
    group: ae
    summary: Sets or reads the table that maps total gain to the AE brightness target, so the target can fall in the dark.
    unverified: true
  ISP_Tuning_Get/SetAeWeight:
    group: ae
    summary: Sets or reads the metering weights of the AE grid; zones with a higher weight count more.
    unverified: true
  ISP_Tuning_Get/SetAeHist:
    group: ae
    summary: Reads or sets the histogram parameters of the AE (bin thresholds and weights).
    unverified: true
  ISP_Tuning_Get/SetAeExpList:
    group: ae
    summary: Reads or sets the exposure table (list of integration time and gain steps) the AE walks through.
    unverified: true
  ISP_Tuning_AE_Get/SetROI:
    group: ae
    summary: Sets or reads a region of interest for the exposure metering.
    unverified: true
  ISP_Tuning_GetAE_IT_MAX:
    group: ae
    summary: Reads the upper limit of the AE integration time.
    unverified: true
  ISP_Tuning_SetAe_IT_MAX:
    group: ae
    summary: Sets the upper limit of the AE integration time. A short limit reduces motion blur and raises gain instead.
    unverified: true
  ISP_Tuning_SetAeFreeze:
    group: ae
    summary: Freezes the current exposure (non-zero) or releases it (zero).
    unverified: true
  ISP_Tuning_GetAeLuma:
    group: stat
    summary: Reads the mean luma of the picture as seen by the AE.
    returns: 0 on success, -1 on error. The value is written to the output argument.
    unverified: true
  ISP_Tuning_GetAeState:
    group: stat
    summary: Reads whether the AE has converged.
    unverified: true
  ISP_Tuning_GetAeZone:
    group: stat
    summary: Reads the per-zone luma values of the AE grid.
    diff: Not served by the stock T10/T20 kernel module, so on T10 and T20 the call is a no-op that returns success.
    unverified: true
  ISP_Tuning_GetAeHist_Origin:
    group: stat
    summary: Reads the unprocessed AE histogram.
    unverified: true
  ISP_Tuning_GetAeStatistics:
    group: stat
    summary: Reads the AE statistics block (histogram and zone data) of the last frame.
    unverified: true
  ISP_Tuning_GetAEEvList:
    group: stat
    summary: Reads the list of EV values of the AE.
    unverified: true
  ISP_Tuning_GetAeEvList:
    group: stat
    summary: Same as `GetAEEvList` with the spelling the newer library uses.
    unverified: true
  ISP_Tuning_GetAeAtList:
    group: stat
    summary: Reads the AE target list (brightness targets per gain step) in use.
    unverified: true
  ISP_Tuning_Get/SetWB:
    group: awb
    summary: Reads or sets the white balance mode and, for manual mode, the red and blue gains.
    params:
      wb: "`IMPISPWB`: `mode` (`IMPISP_WB_MODE_AUTO` or `IMPISP_WB_MODE_MANUAL`; the field also takes the other values of the driver's white-balance mode enum, which are fixed presets), `rgain` and `bgain`. On T20 the gains are Q7 (128 is 1.0) and only the low 8 bits count."
    notes: "Manual mode needs the gains in the structure; auto mode ignores them."
    diff: On T21, auto mode could show a magenta picture in one test; open.
    unverified: true
    see_also: [ISP_Tuning_GetWB_Statis]
  ISP_Tuning_GetWB_Statis:
    group: awb
    summary: Reads the colour temperature and gains that the AWB currently uses.
    unverified: true
  ISP_Tuning_GetWB_GOL_Statis:
    group: awb
    summary: Reads the global AWB statistics (mean R, G, B of the picture).
    unverified: true
  ISP_Tuning_SetWB_ALGO:
    group: awb
    summary: Selects the AWB algorithm variant.
    unverified: true
  ISP_Tuning_Get/SetAwbAttr:
    group: awb
    summary: Reads or sets the AWB attribute block of the newer SoCs.
    unverified: true
  ISP_Tuning_Get/SetAwbWeight:
    group: awb
    summary: Sets or reads the weights of the AWB zones.
    notes: On T23 and T31 the stock driver treats this as a no-op, and OpenIMP matches that.
    unverified: true
  ISP_Tuning_Get/SetAwbZoneWeight:
    group: awb
    summary: Sets or reads the AWB zone weights as a zone table.
    unverified: true
  ISP_Tuning_Get/SetAwbHist:
    group: awb
    summary: Reads or sets the AWB histogram parameters.
    notes: A no-op on T23 and T31, like the stock driver.
    unverified: true
  ISP_Tuning_Get/SetAwbClust:
    group: awb
    summary: Reads or sets the colour clusters of the AWB (the set of grey points it accepts).
    unverified: true
  ISP_Tuning_Get/SetAwbCtTrend:
    group: awb
    summary: Reads or sets the trend curve that links colour temperature and the red/blue ratio.
    unverified: true
  ISP_Tuning_Get/SetAwbCtTrendOffset:
    group: awb
    summary: Reads or sets an offset of the colour temperature trend, to shift the white balance warmer or cooler.
    unverified: true
  ISP_Tuning_Get/SetAwbConvergeStep:
    group: awb
    summary: Reads or sets how fast the AWB follows a light change.
    unverified: true
  ISP_Tuning_GetAWBCt:
    group: awb
    summary: Reads the colour temperature the AWB has estimated, in Kelvin.
    unverified: true
  ISP_Tuning_SetAwbCt:
    group: awb
    summary: Sets the colour temperature for the manual white balance.
    unverified: true
  ISP_Tuning_Awb_Get/SetRgbCoefft:
    group: awb
    summary: Reads or sets the red, green and blue correction coefficients of the white balance.
    unverified: true
  ISP_Tuning_Awb_Get/SetCwfShift:
    group: awb
    summary: Reads or sets the shift of the cool white fluorescent reference point of the AWB.
    unverified: true
  ISP_Tuning_AwbSync:
    group: awb
    summary: Copies the AWB result of one sensor to the other on dual-sensor boards.
    unverified: true
  ISP_Tuning_GetAwbZone:
    group: stat
    summary: Reads the per-zone AWB statistics (average R/G and B/G of each zone).
    unverified: true
  ISP_Tuning_GetAwbGlobalStatistics:
    group: stat
    summary: Reads the global AWB statistics of the last frame.
    unverified: true
  ISP_Tuning_GetAwbStatistics:
    group: stat
    summary: Reads the per-zone AWB statistics of the newer SoCs. Takes the sensor input as first argument.
    unverified: true
  ISP_Tuning_Get/SetBcshHue:
    group: color
    summary: "Sets or reads the hue rotation (one byte). The scale was not verified."
    notes: "On T40 and T41 the call takes the video input and a pointer to the byte."
    unverified: true
  ISP_Tuning_Get/SetContrast:
    group: color
    summary: "Sets or reads the contrast, one byte, 128 is the default."
    notes: "The byte goes unchanged to the ISP driver. On T40 and T41 the call takes the video input and a pointer to the byte, and the getter returns the value the application set last (it does not read the driver)."
  ISP_Tuning_Get/SetSaturation:
    group: color
    summary: "Sets or reads the colour saturation, one byte, 128 is the default."
    notes: "The byte goes unchanged to the ISP driver; below 128 reduces the colour. On T40 and T41 the call takes the video input and a pointer to the byte, and the getter returns the value the application set last."
  ISP_Tuning_SetBrightness:
    group: color
    summary: "Sets the brightness, one byte, 128 is the default."
    notes: "The byte goes unchanged to the ISP driver. On T40 and T41 the call takes the video input and a pointer to the byte."
    diff: On T21 the value scales the AE target by value/128, so brightness acts through the exposure control (beyond the vendor, whose T21 call changes nothing).
  ISP_Tuning_GetBrightness:
    group: color
    summary: "Reads the brightness value."
    notes: "On T40 and T41 the getter returns the value the application set last (default 128) and does not read the driver."
    diff: The T40 getter returned -1 in the RC1 test; it now returns the per-input cached value like the vendor library.
  ISP_Tuning_SetSharpness:
    group: color
    summary: "Sets the sharpness, one byte, 128 is the default."
    notes: "The byte goes unchanged to the ISP driver. On T40 and T41 the call takes the video input and a pointer to the byte."
    diff: On T21 and one other SoC the value has no visible effect in our tests, as with the vendor library.
  ISP_Tuning_GetSharpness:
    group: color
    summary: "Reads the sharpness value."
    notes: "On T40 and T41 the getter returns the value the application set last (default 128)."
  ISP_Tuning_Get/SetColorfxMode:
    group: color
    summary: "Selects a colour effect: auto (normal), black and white, sepia, negative or vivid."
    params:
      mode: "`IMPISP_COLORFX_MODE_AUTO` (0), `_BW` (1), `_SEPIA` (2), `_NEGATIVE` (3) or `_VIVID` (9)."
    diff: Sepia works on T21 although the vendor library has no effect there.
    unverified: true
  ISP_Tuning_Get/SetGamma:
    group: color
    summary: Sets or reads the gamma curve table.
    notes: A curve that falls anywhere is rejected. On T23 the new curve is applied at once.
    diff: Applied at once on T23, where the stock behaviour is to wait.
    unverified: true
  ISP_Tuning_Get/SetGammaAttr:
    group: color
    summary: Reads or sets the gamma attribute block (curve and mode) on the newer SoCs.
    unverified: true
  ISP_Tuning_Get/SetCCMAttr:
    group: color
    summary: Reads or sets the colour correction matrix.
    unverified: true
  ISP_Tuning_Get/SetCsc_Attr:
    group: color
    summary: Reads or sets the colour space conversion (RGB to YUV) matrix and range.
    unverified: true
  ISP_Tuning_Get/SetISPCSCAttr:
    group: color
    summary: Reads or sets the colour space conversion of the newer SoCs.
    unverified: true
  ISP_Get/SetCsccrMode:
    group: color
    summary: Reads or sets the mode of the chroma conversion stage.
    unverified: true
  ISP_Tuning_Get/SetModule_Ratio:
    group: color
    summary: Reads or sets how strongly individual ISP blocks work, as a ratio.
    unverified: true
  ISP_Tuning_Get/SetModuleControl:
    group: color
    summary: Switches individual ISP processing blocks on or off (bypass bits).
    params:
      ispmodule: Bit field with one bit per processing block (`IMPISPModuleCtl`).
    notes: Useful to find out which block causes an artefact. On T41 the driver may refuse the control.
    unverified: true
  ISP_Tuning_SetDPStrength:
    group: nr
    summary: Sets the strength of the dead pixel correction.
    unverified: true
  ISP_Tuning_Get/SetDPC_Strength:
    group: nr
    summary: Sets or reads the strength of the dead pixel correction, as a percentage.
    unverified: true
  ISP_Tuning_Get/SetDRC_Strength:
    group: nr
    summary: Sets or reads the strength of the dynamic range compression (it brings out dark areas).
    unverified: true
  ISP_Tuning_EnableDRC:
    group: nr
    summary: Switches the dynamic range compression block on or off.
    unverified: true
  ISP_Tuning_Get/SetRawDRC:
    group: nr
    summary: Reads or sets the DRC attributes of the raw stage.
    unverified: true
  ISP_Tuning_Get/SetDefog_Strength:
    group: nr
    summary: Sets or reads the defog strength.
    unverified: true
  ISP_Tuning_EnableDefog:
    group: nr
    summary: Switches defog on or off.
    diff: Takes the enable flag as the vendor does; the earlier stub always switched it on.
    unverified: true
  ISP_Tuning_SetAntiFogAttr:
    group: nr
    summary: Sets the anti-fog attribute.
    notes: Accepted, no picture change on T21 in our tests, as with the vendor library.
    unverified: true
  ISP_Tuning_Get/SetSinterDnsAttr:
    group: nr
    summary: Reads or sets the spatial (2D) noise reduction attributes.
    unverified: true
  ISP_Tuning_Get/SetTemperDnsAttr:
    group: nr
    summary: Reads or sets the temporal (3D) noise reduction attributes.
    unverified: true
  ISP_Tuning_SetTemperDnsCtl:
    group: nr
    summary: Sets the control word of the temporal noise reduction.
    unverified: true
  ISP_Tuning_SetSinterStrength:
    group: nr
    summary: "Sets the strength of the spatial (2D) noise reduction as a ratio."
    unverified: true
  ISP_Tuning_SetTemperStrength:
    group: nr
    summary: "Sets the strength of the temporal (3D) noise reduction as a ratio."
    unverified: true
  ISP_Tuning_SetMeshShadingScale:
    group: nr
    summary: Selects the scale of the lens shading (vignette) correction.
    unverified: true
  ISP_Tuning_Get/SetISPRunningMode:
    group: dn
    summary: Switches the ISP between day mode and night mode, or reads the mode.
    params:
      mode: "`IMPISP_RUNNING_MODE_DAY` (0) or `IMPISP_RUNNING_MODE_NIGHT` (1)."
    notes: "The IR-cut filter and the IR LEDs are not switched by this call (it is a user-space and driver call only); the application drives them. A common sequence for night is IR-cut off, LEDs on, then this call."
    unverified: true
    see_also: [ISP_Tuning_Get/SetSceneMode]
  ISP_Tuning_Get/SetISPCustomMode:
    group: dn
    summary: Selects a custom ISP mode (an extra tuning set that the application can switch to).
    unverified: true
  ISP_Tuning_Get/SetSceneMode:
    group: dn
    summary: Selects a scene preset (auto, indoor, outdoor and so on).
    diff: The vendor T21 kernel module ignores the call; OpenIMP matches that.
    unverified: true
  ISP_Tuning_SetFWFreeze:
    group: dn
    summary: Freezes the ISP firmware loop (AE, AWB and the other adaptive steps) while the picture stays, or resumes it.
    unverified: true
  ISP_Tuning_SetISPProcess:
    group: dn
