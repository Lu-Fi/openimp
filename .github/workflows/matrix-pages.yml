# Regenerates the feature matrix from docs/status/ (features.yaml, history.md, issues.json),
# docs/api_evidence.json and docs/api_exports.json on every push to next and publishes
# it with GitHub Pages: index.html = start page (tools/gen_site_index.py) with links to the matrix, the issue
# views and the light-box protocols (docs/lightbox/*.html + their key-number *.json, copied to lightbox/; one cam/<alias>.html trend page per camera).  The issue cache issues.json is refreshed
# from the public GitHub issues at build time (tools/status_data.py --refresh-issues).
name: feature-matrix pages

on:
  push:
    branches: [next]
    paths:
      - 'docs/**'
      - 'tools/status_data.py'
      - 'tools/gen_feature_matrix_html.py'
      - 'tools/gen_api_coverage.py'
      - 'tools/gen_site_index.py'
      - 'tools/export-check/**'
      - '.github/workflows/matrix-pages.yml'
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # cancelling a run mid-deploy leaves a Pages deployment "in progress" that fails every later deploy

jobs:
  build:
    # GitHub Pages is only enabled on the Lu-Fi fork; skip on mirrors (e.g. opensensor/openimp)
    if: github.repository == 'Lu-Fi/openimp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the generator compares with the RC tags
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Refresh the issue cache (state of the public issues)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/status_data.py --refresh-issues
      - name: Validate status data
        run: python3 tools/status_data.py --check
      - name: Generate
        run: |
          python3 tools/gen_feature_matrix_html.py
          mkdir -p _site
          cp docs/feature-matrix.html _site/feature-matrix.html
          mkdir -p _site/lightbox _site/assets
          cp docs/assets/banner.svg docs/assets/banner-dark.svg docs/assets/logo.svg docs/assets/logo-dark.svg _site/assets/
          cp docs/lightbox/*.html _site/lightbox/ 2>/dev/null || true
          cp docs/lightbox/*.webp _site/lightbox/ 2>/dev/null || true   # light-box logo
          cp docs/lightbox/*.json _site/lightbox/ 2>/dev/null || true   # key numbers per run, read for the cam/<alias>.html trend pages
          python3 tools/gen_site_index.py _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # a deploy started while another one is still finishing fails with "in progress deployment" (2026-11-09):
      # try again once after 90 s instead of failing the run
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deployment.outcome == 'failure'
        run: sleep 90
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
